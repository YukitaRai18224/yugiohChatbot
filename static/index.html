<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유희왕 챗봇</title>
  <style>
    :root {
      --bg: #f4f1ea; --panel: #ffffff; --text: #1d1b16; --muted: #6b665c;
      --accent: #8a5a14; --user: #2f2a20; --user-text: #f7f2e7; --border: #e2dccf;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16140f; --panel: #211e17; --text: #ece6d8; --muted: #a39d8f;
        --accent: #d9a24a; --user: #3a3426; --user-text: #f7f2e7; --border: #353024;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100dvh;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    }
    header h1 { font-size: 1.05rem; margin: 0; }
    header h1 span { color: var(--accent); }
    button {
      font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); color: var(--text); padding: 6px 12px;
    }
    #log { flex: 1; overflow-y: auto; padding: 16px; max-width: 820px; width: 100%; margin: 0 auto; }
    .msg { margin: 10px 0; padding: 10px 14px; border-radius: 12px; line-height: 1.6;
           white-space: pre-wrap; word-break: break-word; max-width: 90%; }
    .user { background: var(--user); color: var(--user-text); margin-left: auto; width: fit-content; }
    .bot { background: var(--panel); border: 1px solid var(--border); width: fit-content; }
    .hint { color: var(--muted); font-size: .92rem; text-align: center; margin-top: 15vh; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border);
           background: var(--panel); max-width: 820px; width: 100%; margin: 0 auto; }
    textarea {
      flex: 1; resize: none; font: inherit; padding: 10px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); min-height: 44px; max-height: 160px;
    }
    #send { background: var(--accent); color: #fff; border: none; padding: 0 18px; }
    #send:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>🃏 <span>유희왕</span> 챗봇</h1>
    <button id="reset" type="button">새 대화</button>
  </header>
  <main id="log">
    <p class="hint" id="hint">룰 판정, 카드 효과 해석, 덱 구축 등 무엇이든 물어보세요.<br>
      예) "체인 2에서 무효 효과가 발동되면 어떻게 처리돼?"</p>
  </main>
  <form id="form">
    <textarea id="input" placeholder="메시지를 입력하세요" rows="1"></textarea>
    <button id="send" type="submit">전송</button>
  </form>
  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    let sessionId = null;
    try { sessionId = sessionStorage.getItem("ygo-session"); } catch (_) {}

    function addMsg(text, cls) {
      document.getElementById("hint")?.remove();
      const el = document.createElement("div");
      el.className = "msg " + cls;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function ask(text) {
      addMsg(text, "user");
      const bot = addMsg("…", "bot");
      send.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        sessionId = res.headers.get("X-Session-Id");
        try { sessionStorage.setItem("ygo-session", sessionId); } catch (_) {}
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let out = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          out += decoder.decode(value, { stream: true });
          bot.textContent = out;
          log.scrollTop = log.scrollHeight;
        }
        if (!out) bot.textContent = "(빈 응답)";
      } catch (err) {
        bot.textContent = "⚠️ 서버와 통신하지 못했습니다: " + err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      input.value = "";
      ask(text);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    document.getElementById("reset").addEventListener("click", async () => {
      if (sessionId) {
        await fetch("/api/reset", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId }),
        }).catch(() => {});
      }
      sessionId = null;
      try { sessionStorage.removeItem("ygo-session"); } catch (_) {}
      log.innerHTML = '<p class="hint" id="hint">새 대화를 시작합니다. 무엇이든 물어보세요.</p>';
    });
  </script>
</body>
</html>
