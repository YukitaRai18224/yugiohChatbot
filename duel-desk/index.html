<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a one-to-one messenger. Contact header on top, chat wallpaper with grouped bubbles, pill composer at the bottom.
   The friend's bubbles are paper white; mine take the spell-card green. */
:root {
  --wall: #d9e1ea;
  --bar: #f7f9fb;
  --them: #ffffff;
  --them-ink: #18212b;
  --me: #1c8a6c;
  --me-ink: #ffffff;
  --ink: #18212b;
  --muted: #5f6c7b;
  --meta: #56626f;
  --line: #d0d8e1;
  --field: #edf1f5;
  --notice: rgb(24 33 43 / .12);
  --warn: #a3305e;
  --foil: #b57f17;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall: #0e141b; --bar: #161d26; --them: #222b36; --them-ink: #e8edf2; --me: #2a9c7d; --me-ink: #f4fffb;
    --ink: #e8edf2; --muted: #95a1af; --meta: #8995a3; --line: #28323e; --field: #1e2631; --notice: rgb(255 255 255 / .08);
    --warn: #e8779f; --foil: #ddb04f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall: #0e141b; --bar: #161d26; --them: #222b36; --them-ink: #e8edf2; --me: #2a9c7d; --me-ink: #f4fffb;
  --ink: #e8edf2; --muted: #95a1af; --meta: #8995a3; --line: #28323e; --field: #1e2631; --notice: rgb(255 255 255 / .08);
  --warn: #e8779f; --foil: #ddb04f; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--wall); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  display: flex; flex-direction: column; overflow: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--me); outline-offset: 2px; }
.field:focus-within { box-shadow: 0 0 0 2px var(--me); }
.col { width: 100%; max-width: 680px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }

/* Contact header */
header { flex: none; background: var(--bar); border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
header .col { display: flex; align-items: center; gap: 10px; padding-block: 9px; }
.contact { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 2px; margin: 0; cursor: pointer; text-align: left; min-width: 0; border-radius: 10px; }
.contact img { width: 40px; height: 40px; border-radius: 40%; object-fit: cover; background: #fff; flex: none; }
.contact b { display: block; font-weight: 600; font-size: 1rem; }
.status { display: block; font-size: .76rem; color: var(--muted); }
.status.typing { color: var(--me); }
.spacer { flex: 1; }
.icon { width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; flex: none; }
.icon:hover { background: var(--field); }
.icon svg { width: 22px; height: 22px; }

.menu {
  position: absolute; top: calc(100% + 6px); right: max(14px, env(safe-area-inset-right, 0px), calc((100% - 680px) / 2 + 14px)); width: min(290px, calc(100vw - 28px));
  background: var(--bar); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: 0 10px 30px rgb(0 0 0 / .18);
  display: flex; flex-direction: column; gap: 12px;
}
.menu h3 { margin: 0; font-size: .74rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--field); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 4px; border-radius: 7px; font-size: .82rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--bar); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .14); }
.menu .row-btn { border: 1px solid var(--line); background: transparent; border-radius: 9px; padding: 8px 10px; text-align: left; cursor: pointer; font-size: .88rem; }
.menu .row-btn.danger { color: var(--warn); border-color: var(--warn); }
.menu p { margin: 0; font-size: .74rem; color: var(--muted); line-height: 1.55; }

/* Chat */
#log { flex: 1; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
#thread { display: flex; flex-direction: column; gap: 10px; padding-block: 14px 18px; }
.divider { align-self: center; font-size: .74rem; color: var(--meta); background: var(--notice); padding: 4px 12px; border-radius: 999px; margin: 6px 0; }
.notice { align-self: center; max-width: 88%; text-align: center; font-size: .78rem; line-height: 1.5; color: var(--ink); background: var(--notice); padding: 6px 12px; border-radius: 12px; }
.notice.warn { color: var(--warn); }

.group { display: flex; gap: 8px; align-items: flex-start; max-width: 100%; }
.group.me { justify-content: flex-end; }
.group .face { width: 38px; height: 38px; border-radius: 40%; flex: none; cursor: pointer; border: 0; padding: 0; }
.stack { display: flex; flex-direction: column; gap: 4px; min-width: 0; max-width: min(78%, 460px); }
.me .stack { align-items: flex-end; }
.name { font-size: .78rem; color: var(--muted); margin: 0 0 1px 2px; }
.line { display: flex; align-items: flex-end; gap: 5px; max-width: 100%; }
.me .line { flex-direction: row-reverse; }
.bubble {
  padding: 8px 12px; border-radius: 16px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  min-width: 0; max-width: 100%;
}
.them .bubble { background: var(--them); color: var(--them-ink); }
.me .bubble { background: var(--me); color: var(--me-ink); }
.them .name + .line .bubble { border-top-left-radius: 5px; }
.me .line:first-child .bubble { border-top-right-radius: 5px; }
.bubble.photo { padding: 0; background: transparent; }
.bubble.photo img { display: block; max-width: 200px; max-height: 260px; border-radius: 14px; }
.meta { flex: none; display: flex; flex-direction: column; align-items: flex-end; font-size: .66rem; color: var(--meta); line-height: 1.25; padding-bottom: 1px; font-variant-numeric: tabular-nums; }
.them .meta { align-items: flex-start; }
.unread { color: var(--foil); font-weight: 600; }
.dots { display: inline-flex; gap: 4px; padding: 5px 2px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .45; }
@media (prefers-reduced-motion: no-preference) {
  .dots i { animation: blink 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
  .line { animation: pop .16s ease-out; }
  @keyframes pop { from { transform: translateY(4px) scale(.98); opacity: .4; } to { transform: none; opacity: 1; } }
}

/* Composer */
footer { flex: none; background: var(--bar); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
footer .col { padding-block: 8px; display: flex; flex-direction: column; gap: 8px; }
.quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex: none; border: 1px solid var(--line); background: var(--bar); border-radius: 999px; padding: 6px 12px; font-size: .84rem; cursor: pointer; white-space: nowrap; }
.quick button:hover { border-color: var(--me); color: var(--me); }
.pending { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); }
.pending img { height: 44px; width: 44px; object-fit: cover; border-radius: 8px; }
.pending button { border: 0; background: var(--field); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: .78rem; }
form { display: flex; align-items: flex-end; gap: 6px; }
.field { flex: 1; min-width: 0; display: flex; background: var(--field); border-radius: 22px; padding: 4px 6px 4px 14px; }
textarea {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); resize: none; font: inherit; line-height: 1.45;
  padding: 7px 0; max-height: 140px; outline: none;
}
textarea::placeholder { color: var(--muted); }
#send { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 0; background: var(--me); color: var(--me-ink); cursor: pointer; display: grid; place-items: center; transition: opacity .15s; }
#send svg { width: 20px; height: 20px; }
#send:disabled { opacity: .35; cursor: default; }

/* Profile */
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgb(8 12 18 / .55); padding: 20px; }
.card {
  width: min(320px, 100%); background: var(--bar); border-radius: 22px; overflow: hidden; box-shadow: 0 20px 50px rgb(0 0 0 / .3);
  display: flex; flex-direction: column;
}
.card img { display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 420 / 521; background: #fff; }
.card .info { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 4px; text-align: center; }
.card .info b { font-size: 1.15rem; }
.card .info span { color: var(--muted); font-size: .88rem; }
.card button { margin: 0 18px 18px; border: 0; background: var(--field); border-radius: 12px; padding: 10px; cursor: pointer; }
</style>

<header>
  <div class="col">
    <button type="button" class="contact" id="contact" aria-label="나나세 프로필 보기">
      <img id="hdr-avatar" src="nanase-face.webp" alt="">
      <span><b>나나세</b><span class="status" id="status">대화 가능</span></span>
    </button>
    <span class="spacer"></span>
    <button type="button" class="icon" id="menu-btn" aria-label="메뉴" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
    </button>
  </div>
  <div class="menu" id="menu" hidden>
    <h3>답변 방식</h3>
    <div class="seg" role="group" aria-label="답변 방식">
      <button type="button" id="mode-quick" data-tier="quick" aria-pressed="false">빠르게</button>
      <button type="button" id="mode-default" data-tier="default" aria-pressed="true">기본</button>

    <button type="button" class="row-btn" id="clear-btn">대화 내용 지우기</button>
    <p>답변은 보는 사람의 Claude 계정으로 만들어져요. 금지·제한 리스트는 공식 발표를 함께 확인하세요.</p>
  </div>

<main id="log" aria-live="polite">
  <div class="col" id="thread"></div>
</main>

<footer>
  <div class="col">
    <div class="quick" id="quick" aria-label="빠른 질문">
      <button type="button" id="q1">체인 처리 순서 헷갈려</button>
      <button type="button" id="q2">'할 수 있다'랑 '한다' 차이가 뭐야?</button>
      <button type="button" id="q3">링크랑 엑시즈 소재 차이</button>
      <button type="button" id="q4">첫 덱 뭐 사야 돼?</button>

      <img id="pending-img" alt="보낼 사진">

    <form id="form">
      <button type="button" class="icon" id="attach-btn" aria-label="카드 사진 보내기" hidden>

      </button>

</footer>

<div class="sheet" id="profile" hidden>
  <div class="card" role="dialog" aria-label="나나세 프로필">
    <img src="nanase-full.webp" alt="나나세" width="420" height="521">
    <div class="info"><b>나나세</b><span>체인 꼬이면 불러. 카드 사진도 OK</span></div>
    <button type="button" id="profile-close">닫기</button>
  </div>
</div>

<script>
const SMILE = "[[미소]]";
const RULES = `당신은 '나나세'입니다. 마녀 모자를 쓴 은발의 듀얼리스트이고, 사용자와는 몇 년째 같이 듀얼해 온 허물없는 오랜 찐친입니다. 유희왕 오피셜 카드게임(OCG/TCG)은 누구보다 빠삭합니다. 지금 둘은 메신저로 채팅하고 있습니다. 항상 한국어로 답합니다.

말투와 태도:
- 처음부터 끝까지 편한 반말을 씁니다. 존댓말이나 '도와드릴게요' 같은 서비스 말투는 쓰지 않습니다.
- 오랜 친구처럼 스스럼없이 굽니다. 가볍게 놀리거나 투덜대고, 사용자 덱이나 플레이에 솔직하게 한마디 하기도 합니다. 단, 진짜로 무시하거나 비꼬지 않고 욕설이나 비하 표현은 쓰지 않습니다. 사용자가 진지하게 고민하거나 속상해하면 장난은 줄이고 친구로서 진심으로 같이 봐 줍니다.
- 인사치레나 자기소개 없이 바로 본론으로 들어갑니다.
- 말투는 편해도 룰 설명의 정확성은 절대 양보하지 않습니다.

채팅 형식 (중요):
- 실제 친구가 메신저로 보내는 것처럼 씁니다. 마크다운은 쓰지 않습니다. 글머리표, 번호 목록, 굵게, 제목, 표, 코드 블록, 구분선 모두 금지입니다.
- 한 번에 긴 글을 보내지 말고, 짧은 메시지 여러 개로 나눠 보냅니다. 메시지와 메시지 사이는 빈 줄 하나로 구분합니다. 빈 줄로 나뉜 덩어리 하나가 말풍선 하나가 됩니다.
- 메시지 하나는 보통 한두 문장입니다. 가벼운 질문이면 메시지 1~2개, 복잡한 판정이어도 6개 정도를 넘기지 않습니다.
- 순서를 설명해야 하면 목록 대신 "일단", "그다음에", "마지막으로" 같은 말로 자연스럽게 이어 갑니다.
- "좋은 질문이야", "정리하자면", "요약하면", "도움이 됐으면 좋겠어", "궁금한 거 있으면 언제든 물어봐" 같은 AI 같은 상투적인 말은 쓰지 않습니다. 매번 질문으로 끝맺지도 않습니다.
- 'ㅋㅋ', 'ㅇㅇ', '아 그거?' 같은 채팅체는 자연스러울 때만 씁니다. 이모지는 거의 쓰지 않습니다.

유희왕 지식:
- 룰 설명(일반·특수·융합·싱크로·엑시즈·펜듈럼·링크 소환, 체인과 스펠 스피드, 타이밍, 대상 지정, 코스트와 효과 구분), 카드 효과 해석, 여러 효과가 얽힌 상황 판정, 덱 구축, 입문 안내를 합니다.
- 카드 이름은 한국어 정식 명칭을 우선 쓰고, 필요하면 일본어/영어 명칭을 괄호로 덧붙입니다.
- 카드 텍스트나 판정이 확실하지 않으면 아는 척 단정하지 말고, 헷갈린다고 솔직히 말한 뒤 카드 텍스트를 보내거나 사진을 찍어 달라고 합니다.
- 사진을 받으면 먼저 카드 이름과 텍스트를 읽고 이야기합니다.
- 금지·제한 리스트와 최신 메타는 시기마다 바뀌니, 그런 얘기를 할 때는 공식 리밋 레귤레이션을 확인해 보라고 한마디 합니다.
- 유희왕과 무관한 얘기에도 친구처럼 가볍게 받아 주되 길게 끌지 말고 자연스럽게 듀얼 얘기로 돌아옵니다.

표정 표시: 사용자가 고맙다고 하거나 칭찬할 때, 덱이 완성되거나 고민이 풀려 같이 기뻐할 때, 농담을 주고받으며 웃을 만한 순간처럼 웃는 표정이 어울리는 답변이면 맨 마지막 메시지 끝에 ${SMILE} 를 한 번만 적습니다. 평범한 룰 설명, 판정, 정보 전달에는 적지 않습니다. 이 표시는 화면에서 숨겨지고 나나세의 표정만 바뀝니다.

이 메시지는 설정 안내입니다. 이어지는 채팅에 나나세로서 답하세요.`;

const STORE_KEY = "duel-desk-v1";
const MAX_TURNS = 30;
const FACE = { calm: "nanase-face.webp", smile: "nanase_smile-face.webp" };
const GREETING = ["왔네? 오늘은 뭐 때문에 머리 싸매고 있어", "카드 텍스트 헷갈리면 사진 찍어서 보내. 내가 읽어 줄게"];

const $ = id => document.getElementById(id);
const log = $("log"), thread = $("thread"), form = $("form"), input = $("input"), send = $("send");
const statusEl = $("status"), hdrAvatar = $("hdr-avatar"), quick = $("quick");
const fileInput = $("file"), attachBtn = $("attach-btn"), pending = $("pending");

let sample = null;
let available = true;
let turns = [];      // {role, content, smile?, at, photo?}
let tier = "default";
let busy = false;
let ctl = null;
let pendingImage = null;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (s && Array.isArray(s.turns)) turns = s.turns
      .filter(t => t && (t.role === "user" || t.role === "assistant") && typeof t.content === "string" && t.content)
      .map(t => ({ role: t.role, content: t.content, smile: t.smile === true, at: Number(t.at) || Date.now(), photo: t.photo === true || t.content.startsWith("[카드 사진 첨부]") }));
    if (s && ["quick", "default", "complex"].includes(s.tier)) tier = s.tier;
  } catch (_) {}
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ turns: turns.slice(-MAX_TURNS), tier })); } catch (_) {}
}

// Turn Claude's reply into chat lines: drop the hidden expression marker and any markdown that slipped through.
function cleanReply(raw, streaming) {
  const smile = raw.includes(SMILE);
  let text = raw.split(SMILE).join("");
  if (streaming) {
    for (let k = SMILE.length - 1; k > 0; k--) if (text.endsWith(SMILE.slice(0, k))) { text = text.slice(0, -k); break; }
  }
  text = text
    .replace(/```[a-z]*\n?/gi, "")
    .replace(/\*\*(.+?)\*\*/g, "$1").replace(/__(.+?)__/g, "$1")
    .replace(/`([^`\n]+)`/g, "$1")
    .replace(/^[ \t]{0,3}#{1,6}[ \t]+/gm, "")
    .replace(/^[ \t]*[-*•][ \t]+/gm, "")
    .replace(/^[ \t]*-{3,}[ \t]*$/gm, "");
  return { text: text.trim(), smile };
}
const toLines = text => text.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);

const timeFmt = new Intl.DateTimeFormat("ko-KR", { hour: "numeric", minute: "2-digit" });
const dayFmt = new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
const dayKey = t => new Date(t).toDateString();

function scrollDown() { log.scrollTop = log.scrollHeight; }

function divider(at) {
  const d = document.createElement("div");
  d.className = "divider";
  d.textContent = dayFmt.format(new Date(at));
  thread.appendChild(d);
}
function notice(msg, warn) {
  const n = document.createElement("div");
  n.className = "notice" + (warn ? " warn" : "");
  n.textContent = msg;
  thread.appendChild(n);
  scrollDown();
  return n;
}
const faceBg = smile => `#fff url(${smile ? FACE.smile : FACE.calm}) center/cover`;

// One group = one sender's run of bubbles, with the time beside the last bubble.
function makeGroup(role, smile) {
  const g = document.createElement("div");
  g.className = "group " + (role === "user" ? "me" : "them");
  const stack = document.createElement("div");
  stack.className = "stack";
  let face = null;
  if (role !== "user") {
    face = document.createElement("button");
    face.type = "button";
    face.className = "face";
    face.setAttribute("aria-label", "나나세 프로필 보기");
    face.style.background = faceBg(smile);
    face.addEventListener("click", openProfile);
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = "나나세";
    stack.appendChild(name);
    g.appendChild(face);
  }
  g.appendChild(stack);
  thread.appendChild(g);
  return {
    g, stack,
    add(text, photoUrl) {
      const line = document.createElement("div");
      line.className = "line";
      const b = document.createElement("div");
      b.className = "bubble";
      if (photoUrl) { b.classList.add("photo"); const im = document.createElement("img"); im.src = photoUrl; im.alt = "보낸 카드 사진"; b.appendChild(im); }
      else b.textContent = text;
      line.appendChild(b);
      stack.appendChild(line);
      scrollDown();
      return line;
    },
    stamp(at, unread) {
      stack.querySelectorAll(".meta").forEach(m => m.remove());
      const lines = stack.querySelectorAll(".line");
      const last = lines[lines.length - 1];
      if (!last) return null;
      const meta = document.createElement("span");
      meta.className = "meta";
      if (unread) { const u = document.createElement("span"); u.className = "unread"; u.textContent = "1"; meta.appendChild(u); }
      const t = document.createElement("time");
      t.textContent = timeFmt.format(new Date(at));
      meta.appendChild(t);
      last.appendChild(meta);
      return meta;
    },
    setFace(smile) { if (face) face.style.background = faceBg(smile); },
  };
}

function renderAll() {
  thread.textContent = "";
  const first = turns[0]?.at ?? Date.now();
  divider(first);
  let lastDay = dayKey(first);
  const hello = makeGroup("assistant", false);
  GREETING.forEach(t => hello.add(t));
  hello.stamp(first);
  for (const t of turns) {
    if (dayKey(t.at) !== lastDay) { divider(t.at); lastDay = dayKey(t.at); }
    const grp = makeGroup(t.role, t.smile);
    if (t.role === "user") {
      if (t.photo) grp.add("📷 카드 사진");
      grp.add(t.content.replace(/^\[카드 사진 첨부\]\n?/, ""));
    } else {
      toLines(cleanReply(t.content, false).text).forEach(x => grp.add(x));
    }
    grp.stamp(t.at);
  }
  const lastBot = [...turns].reverse().find(t => t.role === "assistant");
  setMood(!!lastBot?.smile);
  quick.hidden = turns.length > 0 || !available;
  if (!available) notice("지금은 나나세랑 연결이 안 돼요. claude.ai에 로그인한 상태로 이 페이지를 열어 주세요.", true);
  scrollDown();
}

function setMood(smile) { hdrAvatar.src = smile ? FACE.smile : FACE.calm; }
function setStatus(typing) {
  statusEl.textContent = typing ? "입력 중…" : (available ? "대화 가능" : "연결 안 됨");
  statusEl.classList.toggle("typing", typing);
}
const ICON_SEND = '<path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/>';
const ICON_STOP = '<rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/>';
function setBusy(b) {
  busy = b;
  $("send-icon").innerHTML = b ? ICON_STOP : ICON_SEND;
  send.setAttribute("aria-label", b ? "멈추기" : "보내기");
  updateSend();
}
function updateSend() { send.disabled = !available || (!busy && !input.value.trim() && !pendingImage); }

function setTier(t) {
  tier = t;
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tier === t)));
  save();
}

const ERRORS = {
  not_granted: "Claude 사용이 허용되지 않아서 나나세가 답할 수 없어요. 페이지를 다시 열고 허용해 주세요.",
  sampling_disabled: "이 계정에서는 Claude를 쓸 수 없어요.",
  rate_limited: "메시지가 너무 많거나 사용 한도에 닿았어요. 잠시 뒤에 다시 보내 주세요.",
  session_expired: "로그인이 만료됐어요. 다시 로그인한 뒤 보내 주세요.",
  refused: "이 메시지에는 답할 수 없어요. 표현을 바꿔서 다시 보내 주세요.",
  prompt_too_large: "대화가 너무 길어졌어요. 메뉴에서 대화 내용을 지우고 다시 시작해 주세요.",
  image_rejected: "사진을 읽지 못했어요. JPG나 PNG로 다시 보내 주세요.",
  images_unavailable: "여기서는 사진을 보낼 수 없어요. 카드 텍스트를 직접 붙여 넣어 주세요.",
  empty_completion: "답장이 비어 있어요. 조금 바꿔서 다시 보내 주세요.",
};
const HIDE = new Set(["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"]);

async function ask(text) {
  if (!sample || busy) return;
  const image = pendingImage;
  const body = text.trim() || (image ? "이 카드 뭐야?" : "");
  if (!body) return;
  clearPending();
  quick.hidden = true;
  const now = Date.now();
  const lastAt = turns.length ? turns[turns.length - 1].at : null;
  if (lastAt && dayKey(lastAt) !== dayKey(now)) divider(now);

  const mine = makeGroup("user");
  if (image) mine.add("", URL.createObjectURL(image));
  mine.add(body);
  const meta = mine.stamp(now, true);
  turns.push({ role: "user", content: (image ? "[카드 사진 첨부]\n" : "") + body, at: now, photo: !!image });
  save();

  setBusy(true);
  ctl = new AbortController();
  const history = turns.slice(-MAX_TURNS).map(t => ({ role: t.role, content: t.content }));
  while (history.length && history[0].role !== "user") history.shift();

  // The friend "reads" the message a moment later, then starts typing.
  let reply = null, typingLine = null, shown = 0;
  const startTyping = () => {
    meta?.querySelector(".unread")?.remove();
    if (reply) return;
    reply = makeGroup("assistant", false);
    typingLine = reply.add("");
    typingLine.firstChild.innerHTML = '<span class="dots" aria-label="입력 중"><i></i><i></i><i></i></span>';
    setStatus(true);
  };
  const readTimer = setTimeout(startTyping, 650);
  const showLines = (lines) => {
    startTyping();
    while (shown < lines.length) {
      const line = reply.add(lines[shown]);
      reply.stack.insertBefore(line, typingLine);
      shown++;
    }
    scrollDown();
  };

  const opts = {
    cache: false,
    signal: ctl.signal,
    modelTier: tier,
    onText: ({ text }) => {
      const lines = toLines(cleanReply(text, true).text);
      showLines(lines.slice(0, -1)); // the message still being written stays behind the typing dots
    },
  };
  if (image) opts.images = image;

  try {
    const res = await sample([{ role: "user", content: RULES }, ...history], opts);
    clearTimeout(readTimer);
    const r = cleanReply(res.text, false);
    showLines(toLines(r.text));
    typingLine.remove();
    reply.setFace(r.smile);
    setMood(r.smile);
    const at = Date.now();
    reply.stamp(at);
    turns.push({ role: "assistant", content: r.text || res.text, smile: r.smile, at });
    if (res.truncated) notice("답장이 길어서 중간에 끊겼어요.");
  } catch (e) {
    clearTimeout(readTimer);
    const code = e && e.code;
    meta?.querySelector(".unread")?.remove();
    if (reply) {
      if (code === "refused") { reply.stack.querySelectorAll(".line").forEach(l => { if (l !== typingLine) l.remove(); }); shown = 0; }
      else if (e?.text) showLines(toLines(cleanReply(e.text, true).text));
      typingLine.remove();
      const kept = [...reply.stack.querySelectorAll(".line .bubble")].map(b => b.textContent);
      if (!kept.length) reply.g.remove();
      else {
        const at = Date.now();
        reply.stamp(at);
        turns.push({ role: "assistant", content: kept.join("\n\n"), smile: false, at });
      }
    }
    if (code !== "cancelled") notice(ERRORS[code] || "연결이 끊겼어요. 다시 보내 주세요.", true);
    if (code === "images_unavailable") attachBtn.hidden = true;
    if (HIDE.has(code)) { available = false; input.placeholder = "나나세와 연결할 수 없어요"; }
  } finally {
    ctl = null;
    setStatus(false);
    setBusy(false);
    save();
    scrollDown();
  }
}

function clearPending() {
  const img = $("pending-img");
  if (img.src) { URL.revokeObjectURL(img.src); img.removeAttribute("src"); }
  pendingImage = null; fileInput.value = ""; pending.hidden = true;
  updateSend();
}

form.addEventListener("submit", e => {
  e.preventDefault();
  if (busy) { ctl?.abort(); return; }
  const text = input.value;
  if (!text.trim() && !pendingImage) return;
  input.value = ""; autoGrow();
  ask(text);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
});
function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; updateSend(); }
input.addEventListener("input", autoGrow);
quick.querySelectorAll("button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));

attachBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  const f = fileInput.files && fileInput.files[0];
  if (!f) return;
  pendingImage = f;
  $("pending-img").src = URL.createObjectURL(f);
  pending.hidden = false;
  updateSend();
  input.focus();
});
$("pending-clear").addEventListener("click", clearPending);

// Menu
const menu = $("menu"), menuBtn = $("menu-btn"), clearBtn = $("clear-btn");
function closeMenu() { menu.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); clearBtn.classList.remove("danger"); clearBtn.textContent = "대화 내용 지우기"; }
menuBtn.addEventListener("click", e => { e.stopPropagation(); if (menu.hidden) { menu.hidden = false; menuBtn.setAttribute("aria-expanded", "true"); } else closeMenu(); });
menu.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => { if (!menu.hidden) closeMenu(); });
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setTier(b.dataset.tier)));
clearBtn.addEventListener("click", () => {
  if (!clearBtn.classList.contains("danger")) { clearBtn.classList.add("danger"); clearBtn.textContent = "한 번 더 누르면 모두 지워져요"; return; }
  ctl?.abort(); turns = []; save(); renderAll(); closeMenu(); input.focus();
});

// Profile
const profile = $("profile");
function openProfile() { profile.hidden = false; $("profile-close").focus(); }
$("contact").addEventListener("click", openProfile);
$("profile-close").addEventListener("click", () => { profile.hidden = true; });
profile.addEventListener("click", e => { if (e.target === profile) profile.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") { profile.hidden = true; closeMenu(); } });

load();
setTier(tier);
renderAll();
setStatus(false);
updateSend();

(async () => {
  try { sample = window.claude ? await window.claude.use("sample") : null; } catch (_) { sample = null; }
  if (!sample) {
    available = false;
    input.placeholder = "나나세와 연결할 수 없어요";
    setStatus(false); updateSend(); renderAll();
    return;
  }
  try {
    const lim = await sample.limits();
    attachBtn.hidden = !lim?.images;
    if (lim?.images) fileInput.accept = lim.images.mediaTypes.join(",");
    if (lim?.modelTiers) {
      document.querySelectorAll(".seg button").forEach(b => { if (!lim.modelTiers.includes(b.dataset.tier)) b.hidden = true; });
      if (!lim.modelTiers.includes(tier)) setTier("default");
    }
  } catch (_) {}
})();
</script>
